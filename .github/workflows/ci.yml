name: Linux packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install package build tools
        run: sudo apt-get update && sudo apt-get install -y rpm zstd
      - name: Run tests
        run: npm test
      - name: Build Linux executable and packages
        run: ./packaging/build-linux.sh
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: dompile-linux-packages
          path: packages/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install package build tools
        run: sudo apt-get update && sudo apt-get install -y rpm zstd
      - name: Check release tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Build packages
        run: ./packaging/build-linux.sh
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" packages/* --generate-notes
